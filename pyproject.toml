[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "te-fed-experiments"
version = "2.6.3"
description = "TE-Fed training and evaluation for federated semi-supervised multisensor detection"
readme = "README.md"
authors = [{name = "Pinghan Sun"}, {name = "Wenquan Jin"}]
requires-python = ">=3.12,<3.13"
license = {text = "AGPL-3.0-only"}
dependencies = ["numpy==2.3.5", "Pillow==12.3.0"]

[project.optional-dependencies]
train = ["torch>=2.5.1,<3", "torchvision>=0.20.1,<1", "ultralytics==8.4.0", "scipy>=1.11"]
cpu = ["torch==2.5.1", "torchvision==0.20.1", "ultralytics==8.4.0", "scipy>=1.11"]

[project.scripts]
tefed = "tefed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tefed = ["*.json"]

# Keep the CPU lock separate from CUDA installations.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
